<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumotor - Detalle de Producto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/Style.css">
</head>
<body class="pagina-secundaria bg-light">
  <aside class="promo-bar text-center py-1">
    <p class="m-0"><i class="bi bi-truck"></i> ENVÍOS GRATIS A TODO EL PAÍS &bull; 6 CUOTAS SIN INTERÉS</p>
  </aside>
  
  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-dark-main py-0">
      <div class="container-fluid px-lg-4">
        <a class="navbar-brand d-flex align-items-center" href="Index.html">
          <img src="Img local/logo.png" alt="Neumotor Logo" class="brand-logo">
        </a>
        
        <div class="d-flex align-items-center gap-4 ms-auto">
          <div class="cart-wrapper position-relative" data-bs-toggle="offcanvas" data-bs-target="#carritoOffcanvas">
            <i class="bi bi-cart3 fs-5 text-dark"></i>
            <span class="badge rounded-pill bg-danger cart-badge">0</span>
          </div>
          
          <a href="Index.html" class="btn btn-outline-dark btn-sm d-none d-sm-inline-block">
            <i class="bi bi-arrow-left"></i> Volver a Neumáticos
          </a>
        </div>
      </div>
    </nav>
  </header>
  
  <main class="container py-5">
    <section class="card shadow-sm p-4 border-0" id="detalle-articulo">
    </section>
  </main>
  
  <footer class="footer text-white py-4 mt-5" style="background-color: #111;">
    <div class="container text-center">
      <p class="m-0 small text-white-50">&copy; 2026 Neumotor - Neumáticos de alta calidad.</p>
    </div>
  </footer>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="carritoOffcanvas">
    <div class="offcanvas-header bg-light border-bottom">
      <h5 class="offcanvas-title fw-bold"><i class="bi bi-cart3"></i> Mi Carrito</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div id="carrito-items" class="flex-grow-1 overflow-auto pe-2"></div>
      <div id="carrito-footer" class="mt-3 border-top pt-3"></div>
    </div>
  </div>

  <div id="error-toast" class="toast-error">
    <i class="bi bi-exclamation-triangle-fill fs-5"></i>
    <span id="error-toast-msg" class="flex-grow-1"></span>
    <button id="cerrar-error" class="btn-close btn-close-white"></button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
