<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumotor - Venta de Neumáticos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/Style.css">
</head>
<body class="pagina-principal">
  <aside class="promo-bar text-center py-1" aria-label="Aviso comercial">
    <p class="m-0"><i class="bi bi-truck"></i> ENVÍOS GRATIS A TODO EL PAÍS &bull; 6 CUOTAS SIN INTERÉS</p>
  </aside>
  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-dark-main py-0 position-relative">
      <div class="container-fluid px-lg-4 d-flex flex-wrap align-items-center">
        <button class="navbar-toggler border-0 px-1 d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#navContent" style="z-index: 11;">
          <span class="navbar-toggler-icon"></span>
        </button>
        <a class="navbar-brand d-flex align-items-center m-0 me-lg-4" href="Index.html">
          <img src="Img local/logo.png" alt="Neumotor Logo" class="brand-logo">
        </a>
        <div class="nav-icons d-flex align-items-center gap-3 ms-auto order-lg-last" style="z-index: 11;">
          <span class="text-dark d-none d-md-inline"><i class="bi bi-person fs-5"></i></span>
          <div class="cart-wrapper position-relative" data-bs-toggle="offcanvas" data-bs-target="#carritoOffcanvas">
            <i class="bi bi-cart3 fs-5 text-dark"></i>
            <span class="badge rounded-pill bg-danger cart-badge">0</span>
          </div>
        </div>
        <div class="collapse navbar-collapse w-100 w-lg-auto mt-3 mt-lg-0 order-lg-2" id="navContent">
          <div class="search-box-container mx-auto d-flex align-items-center px-2 px-lg-0 w-100">
            <div class="input-group input-group-sm w-100">
              <input type="text" id="filtro-input" class="form-control" placeholder="Buscar por modelo, marca o medida (ej: 205/55 R16)...">
              <button class="btn btn-action-red" type="button" id="btn-buscar">
                <i class="bi bi-search"></i> BUSCAR
              </button>
            </div>
          </div>
        </div>
      </div>
    </nav>
  </header>
  <nav class="sub-nav py-2 border-bottom shadow-sm">
    <div class="container-fluid px-lg-4 d-flex flex-wrap gap-3 align-items-center justify-content-center justify-content-lg-start">
      <button class="btn-cat active" data-categoria="todos">TODOS</button>
      <button class="btn-cat" data-categoria="Auto">AUTOS</button>
      <button class="btn-cat" data-categoria="SUV">SUV</button>
      <button class="btn-cat" data-categoria="Camioneta">CAMIONETAS</button>
      <button class="btn-cat" data-categoria="Deportivo">DEPORTIVO</button>
      <button class="btn-cat" data-categoria="Utilitario">UTILITARIOS</button>
    </div>
    
  </nav>
  <main class="container-fluid px-lg-4 py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb m-0">
          <li class="breadcrumb-item"><a href="Index.html">Inicio</a></li>
          <li class="breadcrumb-item active" aria-current="page">Neumáticos</li>
        </ol>
      </nav>
      <div class="d-flex align-items-center gap-2 mt-2 mt-sm-0">
        <label for="orden-select" class="small fw-semibold text-muted text-nowrap">Ordenar por:</label>
        <select id="orden-select" class="form-select form-select-sm">
          <option value="">Destacados</option>
          <option value="precio-asc">Menor precio</option>
          <option value="precio-desc">Mayor precio</option>
          <option value="nombre-asc">Nombre (A - Z)</option>
        </select>
      </div>
    </div>
    <div class="row">
      <aside class="col-lg-3 col-md-4 mb-4">
        <div class="filter-panel p-3 border rounded-2 bg-white">
          <h5 class="fw-bold mb-3 border-bottom pb-2">Filtrar por</h5>
          <div class="mb-3">
            <h6 class="fw-bold small text-uppercase text-secondary">Categorías</h6>
            <div class="d-flex flex-column gap-1" id="filter-category-links">
              <span class="filter-link active" data-categoria="todos">Todas las categorías</span>
              <span class="filter-link" data-categoria="Auto">Auto</span>
              <span class="filter-link" data-categoria="SUV">SUV</span>
              <span class="filter-link" data-categoria="Camioneta">Camioneta</span>
              <span class="filter-link" data-categoria="Deportivo">Deportivo</span>
              <span class="filter-link" data-categoria="Utilitario">Utilitario</span>
            </div>
          </div>
          <div class="mb-3">
            <h6 class="fw-bold small text-uppercase text-secondary">Rodado</h6>
            <div class="form-check">
              <input class="form-check-input filter-rodado" type="checkbox" value="R13" id="r13">
              <label class="form-check-label" for="r13">Rodado 13</label>
            </div>
            <div class="form-check">
              <input class="form-check-input filter-rodado" type="checkbox" value="R14" id="r14">
              <label class="form-check-label" for="r14">Rodado 14</label>
            </div>
            <div class="form-check">
              <input class="form-check-input filter-rodado" type="checkbox" value="R15" id="r15">
              <label class="form-check-label" for="r15">Rodado 15</label>
            </div>
            <div class="form-check">
              <input class="form-check-input filter-rodado" type="checkbox" value="R16" id="r16">
              <label class="form-check-label" for="r16">Rodado 16</label>
            </div>
            <div class="form-check">
              <input class="form-check-input filter-rodado" type="checkbox" value="R17" id="r17">
              <label class="form-check-label" for="r17">Rodado 17</label>
            </div>
            <div class="form-check">
              <input class="form-check-input filter-rodado" type="checkbox" value="R18" id="r18">
              <label class="form-check-label" for="r18">Rodado 18</label>
            </div>
          </div>
        </div>
      </aside>
      <section class="col-lg-9 col-md-8">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-3" id="lista-articulos"></div>
      </section>
    </div>
  </main>
  <footer class="footer text-white py-4 mt-5" style="background-color: #111;">
    <div class="container text-center">
      <img src="Img local/logo.png" alt="Neumotor Logo" class="brand-logo mb-3" style="filter: brightness(0) invert(1); margin: 0 auto; height: 50px; object-position: center; position: static; transform: none;">
      <p class="m-0 small text-white-50">&copy; 2026 Neumotor - Especialistas en Neumáticos. Todos los derechos reservados.</p>
    </div>
  </footer>
  <div class="offcanvas offcanvas-end" tabindex="-1" id="carritoOffcanvas">
    <div class="offcanvas-header bg-light border-bottom">
      <h5 class="offcanvas-title fw-bold"><i class="bi bi-cart3"></i> Mi Carrito</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div id="carrito-items" class="flex-grow-1 overflow-auto pe-2"></div>
      <div id="carrito-footer" class="mt-3 border-top pt-3"></div>
    </div>
  </div>
  <div id="error-toast" class="toast-error">
    <i class="bi bi-exclamation-triangle-fill fs-5"></i>
    <span id="error-toast-msg" class="flex-grow-1"></span>
    <button id="cerrar-error" class="btn-close btn-close-white"></button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
