<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumotor - Facturación</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/Style.css">
</head>
<body class="bg-light">
  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-dark-main py-0 position-relative border-bottom">
      <div class="container-fluid px-lg-4 d-flex align-items-center">
        <a href="index.html" class="btn btn-link text-dark p-0 text-decoration-none d-lg-none" style="z-index: 11;">
          <i class="bi bi-arrow-left fs-2"></i>
        </a>
        <a class="navbar-brand d-flex align-items-center m-0" href="index.html">
          <img src="Img local/logo.png" alt="Neumotor Logo" class="brand-logo-facturacion">
        </a>
        <div class="ms-auto" style="z-index: 11;">
          <a href="index.html" class="text-dark text-decoration-none d-none d-lg-inline-block fw-bold">
            <i class="bi bi-arrow-left"></i> Volver a la tienda
          </a>
        </div>
      </div>
    </nav>
  </header>
  <main class="container py-5">
    <div class="row">
      <div class="col-lg-7 mb-4">
        <div class="card border-0 shadow-sm p-4">
          <h4 class="fw-bold mb-4">Detalles de Facturación</h4>
          <form id="form-facturacion">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="nombre" class="form-label fw-semibold">Nombre y Apellido</label>
                <input type="text" class="form-control" id="nombre" required>
              </div>
              <div class="col-md-6">
                <label for="dni" class="form-label fw-semibold">DNI o CUIT</label>
                <input type="text" class="form-control" id="dni" required>
              </div>
              <div class="col-12">
                <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" required>
              </div>
              <div class="col-12">
                <label for="direccion" class="form-label fw-semibold">Dirección de Envío</label>
                <input type="text" class="form-control" id="direccion" required>
              </div>
              <h5 class="fw-bold mt-5 mb-3">Pago Simulado</h5>
              <div class="col-12">
                <label for="tarjeta" class="form-label fw-semibold">Número de Tarjeta Ficticia</label>
                <input type="text" class="form-control" id="tarjeta" placeholder="0000 0000 0000 0000" maxlength="16" required>
              </div>
              <div class="col-md-6">
                <label for="vencimiento" class="form-label fw-semibold">Vencimiento</label>
                <input type="month" class="form-control" id="vencimiento" required>
              </div>
              <div class="col-md-6">
                <label for="cvv" class="form-label fw-semibold">CVV</label>
                <input type="text" class="form-control" id="cvv" maxlength="4" required>
              </div>
            </div>
            <button type="submit" class="btn btn-action-red w-100 py-3 mt-5 fw-bold fs-5">CONFIRMAR COMPRA</button>
          </form>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="card border-0 shadow-sm p-4 sticky-top" style="top: 20px;">
          <h5 class="fw-bold mb-4">Resumen de tu pedido</h5>
          <div id="facturacion-detalle" class="mb-4"></div>
          <div class="d-flex justify-content-between align-items-center border-top pt-3">
            <h4 class="m-0">Total a Pagar</h4>
            <h3 class="m-0 text-dark fw-bold" id="facturacion-total"></h3>
          </div>
        </div>
      </div>
    </div>
  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
